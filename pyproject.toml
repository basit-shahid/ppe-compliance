[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ppe-compliance"
version = "0.1.0"
description = "Semester prototype for person, helmet, and safety vest detection"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "ultralytics>=8.3,<9",
    "opencv-python>=4.8,<5",
    "numpy>=1.24,<3",
    "PyYAML>=6,<7",
    "Pillow>=10.1,<14",
]

[project.optional-dependencies]
ui = ["streamlit>=1.50,<2", "imageio-ffmpeg>=0.5,<1"]
analysis = ["pandas>=2,<3", "matplotlib>=3.8,<4"]
notebook = ["nbclient>=0.10,<1", "nbformat>=5,<6", "ipykernel>=6,<8", "imageio-ffmpeg>=0.5,<1", "pandas>=2,<3"]
docs = ["reportlab>=4,<6"]
qa = ["websockets>=14,<18"]

[project.scripts]
ppe = "ppe_compliance.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
